baseURL = "https://scottblayney.com/"
locale = 'en-us'
title = "Scott Blayney"
theme = "PaperMod"

# Home needs JSON for the search index (layouts/search.html consumes it).
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  author = "Scott Blayney"
  description = "Senior Systems Administrator and DevOps Engineer"
  keywords = ["DevOps", "Kubernetes", "Homelab", "SRE", "Platform Engineering"]
  defaultTheme = "dark"

  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  hideFooter = false

  # Intro block on the homepage. Edit freely — this is drawn from your own posts.
  [params.homeInfoParams]
    Title = "Scott Blayney"
    Content = """
I went back to school in 1996, earned my Microsoft MCSE and Lotus PCLP Admin
certs, and landed my first IT job. Every time I needed to learn something new, I'd
practice on a machine at home first.

Almost thirty years later I'm still doing it. Today I'm a Senior Systems Administrator
and DevOps Engineer, and the home machine is now a 3-node k3s cluster on my desk where
I work toward Kubernetes certifications. This is where I write down what I learn along the way.
"""

  [[params.socialIcons]]
    name = "github"
    title = "GitHub"
    url = "https://github.com/scottblayney"

  [[params.socialIcons]]
    name = "linkedin"
    title = "LinkedIn"
    url = "https://www.linkedin.com/in/scottblayney/"

  [[params.socialIcons]]
    name = "rss"
    title = "RSS"
    url = "/index.xml"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.4
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archives/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40
