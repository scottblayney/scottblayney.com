{{- $siteKey := site.Params.turnstileSiteKey -}}
<form id="contact-form" class="contact-form" method="post" action="/api/contact">
  <label>Name
    <input type="text" name="name" required maxlength="100" autocomplete="name">
  </label>
  <label>Email
    <input type="email" name="email" required maxlength="254" autocomplete="email">
  </label>
  <label>Phone (optional)
    <input type="tel" name="phone" maxlength="40" autocomplete="tel">
  </label>
  <label>How can I help?
    <textarea name="message" required rows="6" maxlength="5000"></textarea>
  </label>
  <div class="hp" aria-hidden="true">
    <label>Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
  </div>
  <div class="cf-turnstile" data-sitekey="{{ $siteKey }}"></div>
  <button type="submit">Send message</button>
  <p id="contact-status" role="status" aria-live="polite"></p>
</form>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
  const form = document.getElementById("contact-form");
  const status = document.getElementById("contact-status");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = form.querySelector("button");
    btn.disabled = true;
    status.textContent = "Sending...";
    try {
      const res = await fetch(form.action, { method: "POST", body: new FormData(form) });
      const data = await res.json();
      if (res.ok) {
        form.reset();
        form.style.display = "none";
        status.textContent = "Thanks! Your message has been sent and I'll get back to you soon.";
        return;
      }
      status.textContent = data.error || "Something went wrong. Please try again.";
    } catch {
      status.textContent = "Network error. Please try again.";
    }
    btn.disabled = false;
    if (window.turnstile) turnstile.reset();
  });
</script>
